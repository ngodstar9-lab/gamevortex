name: Validate GameVortex
on:
  push:
    branches: [main, "upgrade/**"]
  pull_request:
    branches: [main]
jobs:
  syntax-and-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check admin.js
          node --check catalog.js
          node --check sw.js
      - name: Validate web manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest OK')"
