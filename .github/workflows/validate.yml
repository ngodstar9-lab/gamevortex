name: Validate GameVortex
on:
  push:
    branches: [main, "upgrade/**"]
  pull_request:
    branches: [main]
jobs:
  syntax-and-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check admin.js
          node --check catalog.js
          node --check public-features.js
          node --check admin-enhancements.js
          node --check sw.js
          node -e "const fs=require('fs'); for (const f of ['public-features.js','admin-enhancements.js']) { const n=(fs.readFileSync(f,'utf8').match(/\\[\\\"[a-z_]+\\\",/g)||[]).length; if(n!==50) throw new Error(f+' has '+n+' tools, expected 50'); console.log(f+': '+n+' tools OK'); }"
      - name: Validate web manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest OK')"
