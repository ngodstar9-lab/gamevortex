<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08090d"><meta name="robots" content="noindex">
  <title>صفحه پیدا نشد | GameVortex</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap">
  <link rel="stylesheet" href="style.css">
  <style>
    .error-page{min-height:100vh;display:grid;place-items:center;padding:25px;text-align:center;background:radial-gradient(circle at 50% 36%,#32131d 0,transparent 38%),#08090d}
    .error-card{width:min(560px,100%);padding:55px 25px;border:1px solid #40303a;background:#11131aeF;border-radius:8px;box-shadow:0 25px 80px #0008}
    .error-code{font-size:clamp(90px,20vw,160px);line-height:1;font-weight:900;letter-spacing:-8px;color:#ff4655;text-shadow:0 0 60px #ff465533}
    .error-card h1{font-size:25px;margin:16px 0 8px}.error-card p{color:#999dab;font-size:12px;line-height:2;margin:0 auto 25px;max-width:380px}
    .error-brand{justify-content:center;margin-bottom:30px}
  </style>
</head>
<body>
  <main class="error-page">
    <section class="error-card">
      <a class="brand error-brand" href="./"><span class="brand-mark">G</span><span class="brand-name">GAME<span>VORTEX</span></span></a>
      <div class="error-code">404</div>
      <h1>این مرحله پیدا نشد!</h1>
      <p>احتمالاً آدرس اشتباه نوشته شده یا این صفحه دیگر وجود ندارد. برگردیم به صفحه اصلی و بازی بعدی را پیدا کنیم.</p>
      <a class="button button-primary" href="./">بازگشت به GameVortex <span>←</span></a>
    </section>
  </main>
</body>
</html>
